<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Qibla</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f2b25;
    --ink: #f1ead6;
    --muted: #9db5ab;
    --ring: #1f4a3e;
    --tick: #5e8678;
    --gold: #d4ac53;
    --ok: #5cc796;
    --kaaba: #141414;
    --btn-bg: #d4ac53;
    --btn-ink: #1e1a0c;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4efe2;
      --ink: #153a31;
      --muted: #5f7a70;
      --ring: #e1d9c1;
      --tick: #7a9488;
      --gold: #9a7414;
      --ok: #1f8f5f;
      --kaaba: #141414;
      --btn-bg: #8f6b12;
      --btn-ink: #ffffff;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 420px;
    margin: 0 auto;
    padding: 20px 20px 28px;
    display: grid;
    gap: 18px;
  }
  header { text-align: center; }
  h1 {
    margin: 0;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: 0.01em;
  }
  #loc { margin: 6px 0 0; font-size: 14px; color: var(--muted); }

  .compass { width: min(100%, 340px); margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
  .ring { fill: none; stroke: var(--ring); stroke-width: 14; }
  .ok .ring { stroke: var(--ok); }
  .tick { stroke: var(--tick); stroke-width: 1.5; }
  .tick.major { stroke-width: 2.5; }
  .letter {
    fill: var(--muted);
    font: 600 17px system-ui, sans-serif;
    text-anchor: middle;
  }
  .letter.n { fill: var(--gold); }
  .qline { stroke: var(--gold); stroke-width: 2.5; stroke-linecap: round; }
  .ok .qline { stroke: var(--ok); }
  .kaaba { fill: var(--kaaba); stroke: var(--gold); stroke-width: 2; }
  .band { fill: var(--gold); }
  .notch { fill: var(--gold); }
  .ok .notch { fill: var(--ok); }
  .front { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; opacity: .7; }
  .pivot { fill: var(--gold); }

  .readout { text-align: center; }
  .main {
    margin: 0;
    min-height: 2.4em;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 27px;
    line-height: 1.2;
  }
  .ok-text { color: var(--ok); }
  .meta { margin: 12px 0 0; display: flex; justify-content: center; gap: 36px; }
  .meta div { text-align: center; }
  .meta dt { font-size: 13px; color: var(--muted); }
  .meta dd {
    margin: 2px 0 0;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
  }

  button {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 16px;
    font: 600 17px system-ui, sans-serif;
    background: var(--btn-bg);
    color: var(--btn-ink);
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  button[hidden] { display: none; }
  .hint { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); text-align: center; }
  .error { color: #e0816b; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Qibla yo'nalishi</h1>
    <p id="loc">Joylashuv aniqlanmoqda…</p>
  </header>

  <div class="compass">
    <svg id="svg" viewBox="0 0 320 320" role="img" aria-label="Qibla kompasi">
      <g id="dial">
        <circle class="ring" cx="160" cy="160" r="134"/>
        <g id="ticks"></g>
        <g id="letters"></g>
        <g id="qibla">
          <line class="qline" x1="160" y1="160" x2="160" y2="48"/>
          <rect class="kaaba" x="147" y="14" width="26" height="26" rx="5"/>
          <rect class="band" x="147" y="20" width="26" height="4"/>
        </g>
      </g>
      <line class="front" x1="160" y1="160" x2="160" y2="46"/>
      <circle class="pivot" cx="160" cy="160" r="5"/>
      <path class="notch" d="M152 0 L168 0 L160 12 Z"/>
    </svg>
  </div>

  <section class="readout" aria-live="polite">
    <p id="main" class="main">Qibla hisoblanmoqda…</p>
    <dl class="meta">
      <div><dt>Qibla</dt><dd id="qv">–</dd></div>
      <div><dt>Yo'nalishingiz</dt><dd id="hv">–</dd></div>
    </dl>
  </section>

  <button id="start" type="button">Kompasni yoqish</button>
  <p id="hint" class="hint">Telefonni tekis ushlang va metall buyumlar hamda magnitlardan uzoqroq turing.</p>
</main>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const KAABA = { lat: 21.4225, lon: 39.8262 };
  const FALLBACK = { lat: 41.2995, lon: 69.2401 }; // Toshkent
  const NS = 'http://www.w3.org/2000/svg';

  const $ = (id) => document.getElementById(id);
  const svg = $('svg'), dial = $('dial'), qibla = $('qibla');
  const mainEl = $('main'), qv = $('qv'), hv = $('hv');
  const locEl = $('loc'), hintEl = $('hint'), startBtn = $('start');

  const rad = (d) => d * Math.PI / 180;
  const deg = (r) => r * 180 / Math.PI;
  const norm = (d) => ((d % 360) + 360) % 360;
  const diff = (a, b) => ((b - a + 540) % 360) - 180; // eng qisqa burilish: -180..180

  function bearingTo(lat, lon) {
    const p1 = rad(lat), p2 = rad(KAABA.lat), dl = rad(KAABA.lon - lon);
    const x = Math.sin(dl) * Math.cos(p2);
    const y = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
    return norm(deg(Math.atan2(x, y)));
  }

  // ---- Siferblat (shkala va harflar) ----
  const ticks = $('ticks');
  for (let a = 0; a < 360; a += 5) {
    const major = a % 30 === 0;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 160); l.setAttribute('x2', 160);
    l.setAttribute('y1', 42); l.setAttribute('y2', 42 + (major ? 14 : 7));
    l.setAttribute('transform', 'rotate(' + a + ' 160 160)');
    l.setAttribute('class', major ? 'tick major' : 'tick');
    ticks.appendChild(l);
  }
  const letters = $('letters');
  [['N', 0], ['E', 90], ['S', 180], ['W', 270]].forEach(function (p) {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', 160); t.setAttribute('y', 86);
    t.setAttribute('transform', 'rotate(' + p[1] + ' 160 160)');
    t.setAttribute('class', 'letter' + (p[0] === 'N' ? ' n' : ''));
    t.textContent = p[0];
    letters.appendChild(t);
  });

  // ---- Holat ----
  let bearing = null;      // Qibla burchagi (shimoldan)
  let heading = 0;         // telefon qaragan tomon (silliqlangan)
  let target = 0;          // sensordan kelgan oxirgi qiymat
  let sensorOn = false;
  let aligned = false;
  let raf = null;

  function setQibla(lat, lon, note) {
    bearing = bearingTo(lat, lon);
    qibla.setAttribute('transform', 'rotate(' + bearing + ' 160 160)');
    qv.textContent = Math.round(bearing) + '°';
    locEl.textContent = note;
    if (!sensorOn) mainEl.textContent = 'Qibla shimoldan ' + Math.round(bearing) + '° da';
  }

  function locate() {
    const q = new URLSearchParams(location.search);
    const qlat = parseFloat(q.get('lat')), qlon = parseFloat(q.get('lon'));
    if (isFinite(qlat) && isFinite(qlon)) {
      setQibla(qlat, qlon, 'Joylashuv aniqlandi');
      return;
    }
    const fallback = function () {
      setQibla(FALLBACK.lat, FALLBACK.lon, "Joylashuv aniqlanmadi, Toshkent bo'yicha hisoblandi");
    };
    if (!navigator.geolocation) { fallback(); return; }
    navigator.geolocation.getCurrentPosition(
      function (pos) { setQibla(pos.coords.latitude, pos.coords.longitude, 'Joylashuv aniqlandi'); },
      fallback,
      { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 }
    );
  }

  // ---- Kompas ----
  function haptic() {
    try {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      else if (navigator.vibrate) navigator.vibrate(40);
    } catch (e) {}
  }

  function frame() {
    heading = norm(heading + diff(heading, target) * 0.2);
    dial.setAttribute('transform', 'rotate(' + (-heading) + ' 160 160)');
    hv.textContent = Math.round(heading) + '°';

    if (bearing !== null) {
      const d = diff(heading, bearing);
      const abs = Math.abs(d);
      const was = aligned;
      aligned = aligned ? abs <= 6 : abs <= 3;
      svg.classList.toggle('ok', aligned);
      mainEl.classList.toggle('ok-text', aligned);
      if (aligned) {
        mainEl.textContent = 'Qibla shu yoqda';
        if (!was) haptic();
      } else {
        mainEl.textContent = (d > 0 ? "O'ngga " : 'Chapga ') + Math.round(abs) + '° buriling';
      }
    }
    raf = requestAnimationFrame(frame);
  }

  let gotEvent = false;
  function onOrient(e) {
    let h = null;
    if (typeof e.webkitCompassHeading === 'number') {
      h = e.webkitCompassHeading;                 // iOS
    } else if (e.alpha !== null && e.alpha !== undefined) {
      h = norm(360 - e.alpha);                    // Android (absolyut alpha)
    }
    if (h === null || isNaN(h)) return;
    gotEvent = true;
    target = h;
  }

  async function startCompass() {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') throw new Error('denied');
      }
    } catch (err) {
      hintEl.textContent = "Kompas ruxsati berilmadi. Telefon sozlamalaridan ruxsat bering va qayta urinib ko'ring.";
      hintEl.classList.add('error');
      return;
    }

    const evt = ('ondeviceorientationabsolute' in window) ? 'deviceorientationabsolute' : 'deviceorientation';
    window.addEventListener(evt, onOrient, true);
    sensorOn = true;
    startBtn.hidden = true;
    hintEl.classList.remove('error');
    hintEl.textContent = "Telefonni tekis ushlang. Aniqlik past bo'lsa, uni havoda sakkiz (8) shaklida aylantiring.";
    mainEl.textContent = 'Kompas sozlanmoqda…';
    raf = requestAnimationFrame(frame);

    setTimeout(function () {
      if (!gotEvent) {
        hintEl.textContent = "Bu qurilmada kompas sensori topilmadi. Sahifani telefonda oching.";
        hintEl.classList.add('error');
        mainEl.textContent = bearing === null ? '' : 'Qibla shimoldan ' + Math.round(bearing) + '° da';
        cancelAnimationFrame(raf);
        sensorOn = false;
        startBtn.hidden = false;
      }
    }, 2500);
  }

  startBtn.addEventListener('click', startCompass);
  locate();
})();
</script>
</body>
</html>
